server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/r_talky?useSSL=false&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: qszx123456XJF
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true
#        dialect: org.hibernate.dialect.MySQL8Dialect
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.springframework.data.redis: debug

# 短信服务配置
sms:
  provider: aliyun # 可配置为mock或aliyun
  aliyun:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:} # 短信签名
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:} # 短信模板CODE
    region-id: cn-hangzhou # 区域ID
    endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com} # 服务端点
  code:
    expire-minutes: 5
    digits: 6 # 验证码位数

# 一键登录配置
oneclick:
  auth:
    provider: aliyun # 可配置为mock或aliyun
  aliyun:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}

# 设备指纹配置
device:
  fingerprint:
    algorithm: SHA-256
    # 限流配置 - 时间窗口单位为分钟
    rate-limit:
      send-sms:
        max-attempts: 5        # 手机号短信发送限制：5次
        time-window: 1440      # 时间窗口：1440分钟 / 1天
      send-sms-device:
        max-attempts: 10      # 设备短信发送限制：10次
        time-window: 1440     # 时间窗口：1440分钟 / 1天
      login-attempt:
        max-attempts: 10      # 手机号登录尝试限制：10次
        time-window: 1440     # 时间窗口：1440分钟 / 1天
      login-attempt-device:
        max-attempts: 20      # 设备登录尝试限制：20次
        time-window: 1440     # 时间窗口：1440分钟 / 1天
    # 限制惩罚配置
    restriction:
      duration-hours: 24      # 超限后限制时长：24小时

# 缓存配置
cache:
  # 用户会话过期时间（小时）
  user-session-expire: 24
  # 用户信息过期时间（小时）
  user-info-expire: 1
